name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "26"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hdms
          POSTGRES_PASSWORD: hdms
          POSTGRES_DB: hdms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hdms"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: hdms-backend
    steps:
      - uses: actions/checkout@v5

      - name: Scan for committed secrets and leaked example pepper (5.2c)
        working-directory: .
        run: |
          # 1. Assert the example token pepper never appears outside .env.example, docs,
          #    the fail-closed check in config.go, and this scan itself.
          if git grep -I "dev-only-pepper-change-me" -- ':(exclude).env.example' ':(exclude)docs/**' ':(exclude)hdms-backend/internal/platform/config/config.go' ':(exclude).github/workflows/ci.yml'; then
            echo "ERROR: Leaked development token pepper found outside .env.example!"
            exit 1
          fi
          # 2. Assert no committed private keys exist in repository outside dev certs
          if git grep -I -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- ':(exclude)certs/**'; then
            echo "ERROR: Committed private key found in repository!"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hdms-backend/go.sum

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: golangci-lint (includes the module-boundary guard)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: hdms-backend
          version: latest

      - name: task generate produces no diff
        run: |
          (cd api && oapi-codegen -config oapi-codegen.yaml openapi.yaml)
          git diff --exit-code -- internal/platform/httpx/gen
          go run ./cmd/hdms-cli export all
          git diff --exit-code -- ../hdms-frontend/packages/domain/session-machine.json ../hdms-frontend/packages/domain/scenarios.json

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        env:
          HDMS_DATABASE_URL: postgres://hdms:hdms@localhost:5432/hdms?sslmode=disable
        run: go test -tags=integration ./test/...

      - name: Build
        run: |
          go build -o bin/hdms-api ./cmd/hdms-api
          go build -o bin/hdms-cli ./cmd/hdms-cli

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdms-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: hdms-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: api-client generate produces no diff
        run: |
          pnpm --filter @hdms/api-client generate
          git diff --exit-code -- packages/api-client/src/gen

      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hdms
          POSTGRES_PASSWORD: hdms
          POSTGRES_DB: hdms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hdms"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hdms-backend/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: hdms-frontend/pnpm-lock.yaml

      - name: Generate self-signed TLS certs for localhost
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/localhost-key.pem -out certs/localhost.pem -days 365 -nodes -subj "/CN=localhost"

      - name: Migrate database and bootstrap admin
        working-directory: hdms-backend
        env:
          HDMS_DATABASE_URL: postgres://hdms:hdms@localhost:5432/hdms?sslmode=disable
          HDMS_TOKEN_PEPPER: dev-only-pepper
          HDMS_CREDENTIAL_ENC_KEY: O4CAtFId3Jh5por/68sf2I8KracP/ylyP+HjDYsrQac=
          HDMS_TOTP_ENC_KEY: SPCdq6Fv9PRz8jMr3UxAPIaUioFtcwtavZ1kSrtfCfE=
        run: |
          go run ./cmd/hdms-cli migrate
          go run ./cmd/hdms-cli admin bootstrap --email admin@example.org --name "Admin" --password "correct horse battery staple" --totp-secret "VIPF7BGMNRBOPVSVYOIAG33Q5NHWVOZ7"

      - name: Start backend API server
        working-directory: hdms-backend
        env:
          HDMS_DATABASE_URL: postgres://hdms:hdms@localhost:5432/hdms?sslmode=disable
          HDMS_HTTP_ADDR: ":8443"
          HDMS_TLS_CERT_FILE: ../certs/localhost.pem
          HDMS_TLS_KEY_FILE: ../certs/localhost-key.pem
          HDMS_TOKEN_PEPPER: dev-only-pepper
          HDMS_CREDENTIAL_ENC_KEY: O4CAtFId3Jh5por/68sf2I8KracP/ylyP+HjDYsrQac=
          HDMS_TOTP_ENC_KEY: SPCdq6Fv9PRz8jMr3UxAPIaUioFtcwtavZ1kSrtfCfE=
          HDMS_RATE_LIMIT: "off"
          HDMS_ENV: "development"
        run: |
          go run ./cmd/hdms-api &
          for i in {1..30}; do
            if curl -k -s https://localhost:8443/v1/readyz | grep -q "ready"; then
              echo "API is ready!"
              break
            fi
            sleep 1
          done

      - name: Install frontend dependencies and Playwright browser
        working-directory: hdms-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests (E1-E13 + axe a11y)
        working-directory: hdms-frontend
        env:
          HDMS_API_URL: https://localhost:8443
        run: pnpm exec playwright test

      - name: Upload Playwright traces & test results on failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            hdms-frontend/playwright-report/
            hdms-frontend/test-results/
          retention-days: 7
