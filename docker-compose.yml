services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hdms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hdms}
      POSTGRES_DB: ${POSTGRES_DB:-hdms}
    ports:
      - "5442:5432"
    volumes:
      # Postgres 18's image stores data under a major-version-specific
      # subdirectory of /var/lib/postgresql itself, not .../data — mounting
      # the parent is what the image now expects.
      - hdms-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hdms}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./hdms-backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HDMS_ENV: development
      HDMS_RATE_LIMIT: "off"
      HDMS_HTTP_ADDR: ":8443"
      HDMS_DATABASE_URL: postgres://${POSTGRES_USER:-hdms}:${POSTGRES_PASSWORD:-hdms}@db:5432/${POSTGRES_DB:-hdms}?sslmode=disable
      HDMS_TLS_CERT_FILE: /certs/localhost.pem
      HDMS_TLS_KEY_FILE: /certs/localhost-key.pem
    volumes:
      - ./hdms-backend:/app
      - hdms-go-mod-cache:/go/pkg/mod
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

  # Runs scheduled jobs and the admin console's backup requests (plan
  # 2026-09-30). Same image stage as production.
  worker:
    build:
      context: ./hdms-backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HDMS_ENV: development
      HDMS_DATABASE_URL: postgres://${POSTGRES_USER:-hdms}:${POSTGRES_PASSWORD:-hdms}@db:5432/${POSTGRES_DB:-hdms}?sslmode=disable
      HDMS_BACKUP_DIR: /var/backups/hdms
      HDMS_BACKUP_ALLOWED_ROOTS: /var/backups:/mnt/nas
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - hdms-dev-backups:/var/backups/hdms
      # Host folder for a second backup copy: add a destination at /mnt/nas/hdms
      # in the admin console and it appears here on the Mac. Docker creates the
      # folder if it is missing.
      - ${HDMS_BACKUP_NAS_HOST_PATH:-./.dev-backups}:/mnt/nas
    depends_on:
      db:
        condition: service_started

  caddy:
    image: caddy:2-alpine@sha256:ad27e531c8b286ff153c0e6e16587a1583e4111bb58c4d83bd73d6d3ef0a0ce1
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - api
      - worker

volumes:
  hdms-db-data:
  hdms-go-mod-cache:
  hdms-dev-backups:
