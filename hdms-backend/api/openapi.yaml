openapi: 3.1.0
info:
  title: HDMS API
  description: >
    Hito Device Management System. Source of truth for the HTTP contract —
    see docs/06-api-contract.md. Go server interfaces are generated with
    oapi-codegen; the TypeScript client is generated with openapi-ts.
    Neither is hand-edited.

    Contract Versioning Rule:
    After the contract-v1 tag, a breaking change requires /v2, not a silent
    field change — kiosks in the field may lag a deploy.
  version: "1.0.0"
servers:
  - url: /v1

security:
  - adminSession: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe. No auth.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe, including the database. No auth.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process and its dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # --- Admin auth ---------------------------------------------------------

  /auth/login:
    post:
      operationId: login
      summary: Admin login with password + TOTP. Sets the session and CSRF cookies.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. `Set-Cookie` carries `hdms_session` (HttpOnly) and `hdms_csrf` (readable, echoed back as `X-CSRF-Token` on mutating requests).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          description: Invalid credentials, invalid TOTP code, or a disabled account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        default:
          description: Error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/me:
    get:
      operationId: getCurrentAdmin
      summary: The identity of the currently authenticated admin.
      tags: [auth]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # --- Catalog --------------------------------------------------------------

  /devices:
    get:
      operationId: listDevices
      summary: List devices.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceStatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/QueryFilter"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createDevice
      summary: Register a new device.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}:
    get:
      operationId: getDevice
      summary: Fetch one device.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateDevice
      summary: Edit a device's fields, including its condition.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}/status:
    post:
      operationId: setDeviceStatus
      summary: Drive the device status lifecycle. Requires a reason for every transition except registration.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeviceStatusRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /categories:
    get:
      operationId: listCategories
      summary: List device categories.
      tags: [categories]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createCategory
      summary: Create a device category.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /categories/{id}:
    patch:
      operationId: updateCategory
      summary: Edit a device category.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Identity ---------------------------------------------------------

  /users:
    get:
      operationId: listUsers
      summary: List users.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserStatusFilter"
        - $ref: "#/components/parameters/DepartmentFilter"
        - $ref: "#/components/parameters/QueryFilter"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createUser
      summary: Register a borrower. Admin-only (FR-45); `registeredBy` is derived from the session, never client-supplied.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/register-with-card:
    post:
      operationId: registerUserWithCard
      summary: Register a borrower and bind a card in one atomic transaction (FR-41, FR-44, FR-59).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWithCardRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterWithCardResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}:
    get:
      operationId: getUser
      summary: Fetch one user.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateUser
      summary: Edit a user's fields. Employee number is not editable — it is the bulk-import matching key.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}/suspend:
    post:
      operationId: suspendUser
      summary: Suspend a borrower, recording why.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /departments:
    get:
      operationId: listDepartments
      summary: List departments, for the department picker on user forms.
      tags: [users]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Credentials --------------------------------------------------------

  /credentials:
    get:
      operationId: listCredentialsBySubject
      summary: List every credential ever issued to one subject, most recent first.
      tags: [credentials]
      parameters:
        - name: subjectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SubjectType"
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CredentialStatus"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: issueCredential
      summary: Mint a new credential. The plaintext token is returned exactly once.
      tags: [credentials]
      x-sensitive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/blank-batch:
    post:
      operationId: issueBlankBatch
      summary: Mint a batch of unbound "blank card stock" credentials.
      tags: [credentials]
      x-sensitive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueBlankBatchRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueBlankBatchResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/unbound-count:
    get:
      operationId: getUnboundCredentialCount
      summary: Count of unbound "blank card stock" credentials remaining.
      tags: [credentials]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnboundCountResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/resolve:
    get:
      operationId: resolveCredential
      summary: Resolve a scanned token to its credential and subject, for binding a physical card during registration.
      tags: [credentials]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/bind:
    post:
      operationId: bindCredential
      summary: Bind an unbound blank card to a subject.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindCredentialRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/reprint:
    post:
      operationId: reprintCredential
      summary: Recover and re-return the plaintext token of a device credential. Device tokens only.
      tags: [credentials]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      summary: Kill a token permanently, with no replacement minted.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCredentialRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/reissue:
    post:
      operationId: reissueCredential
      summary: For a lost card — revoke the old one and mint a new one in the same transaction.
      tags: [credentials]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReissueCredentialRequest"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/history:
    get:
      operationId: getCredentialHistory
      summary: One credential's issuance history.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialEventList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Paper backfill (2.4b) -------------------------------------------------

  /backfill/preview:
    post:
      operationId: previewBackfillBatch
      summary: >
        Validate a staged paper-register batch and return, per row, the
        auto-detected action (FR-74), the resolved device and person, and any
        custody conflict — writing nothing. The screen calls it as rows change
        so a conflict surfaces while the admin is still looking at the page.
        Admin-only; the kiosk token cannot reach it.
      tags: [backfill]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillBatch"
      responses:
        "200":
          description: The per-row resolution. Conflicts and unresolved rows are ordinary row statuses here, not HTTP errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /backfill:
    post:
      operationId: recordBackfillBatch
      summary: >
        Commit a validated batch atomically — all rows or none. The same
        server-side validation the preview runs is re-run here; a preview is a
        convenience, never a grant. Returns the created loan ids and the ids of
        any users created, which the "issue cards to the new people" step
        (FR-77) is driven from. Admin-only; the kiosk token cannot reach it.
      tags: [backfill]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillBatch"
      responses:
        "200":
          description: The batch was committed. Per-row results carry the created loan ids and the created user ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillResult"
        "409":
          description: The batch contains a row that still conflicts with existing custody; nothing was written. `extensions.clientRowIds` names the conflicting rows — the structured per-row detail is what the preview is for.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /backfill/last-entry:
    get:
      operationId: getBackfillLastEntry
      summary: When a paper page was last recorded — the dashboard's backlog nag (Q11).
      tags: [backfill]
      responses:
        "200":
          description: The most recent paper-origin recording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillLastEntry"
        "204":
          description: No paper entry has been recorded yet.
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Sessions (Kiosk) ---------------------------------------------------

  /sessions:
    post:
      operationId: createSession
      summary: Create a scan session.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      summary: Current state of a scan session (recovery after reload).
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      operationId: cancelSession
      summary: Cancel a scan session.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Session cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/scan:
    post:
      operationId: submitScan
      summary: Submit a scanned token.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Complete session state and outcome. Rejections are 200 with outcome.kind = "rejected".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/return-loan:
    post:
      operationId: returnSessionLoan
      summary: Return an open loan by selecting it directly rather than scanning.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnSessionLoanRequest"
      responses:
        "200":
          description: Complete session state and outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/close:
    post:
      operationId: closeSession
      summary: Finish a scan session ("Done").
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Session closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Loans --------------------------------------------------------------

  /loans:
    get:
      operationId: listLoans
      summary: List loans with optional filters and cursor pagination.
      tags: [loans]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanOrigin"
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: disputed
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}:
    get:
      operationId: getLoan
      summary: Fetch one loan by id.
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}/force-return:
    post:
      operationId: forceReturnLoan
      summary: Administratively close an open loan. Requires a reason.
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceReturnLoanRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}/write-off:
    post:
      operationId: writeOffLoan
      summary: Close an open loan as written-off (declared lost or destroyed).
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffLoanRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}/loans:
    get:
      operationId: listDeviceLoans
      summary: List loan history for one device.
      tags: [devices, loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}/loans:
    get:
      operationId: listUserLoans
      summary: List loan history for one user.
      tags: [users, loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Dashboard & Events -------------------------------------------------

  /dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard summary counts, overdue loans, availability by category, scan rejections, and paper backfill nag.
      tags: [dashboard]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /events/stream:
    get:
      operationId: getEventsStream
      summary: Server-Sent Events stream of domain events for live dashboard and admin updates.
      tags: [events]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Outbox event ID to replay missed events from.
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Kiosks -------------------------------------------------------------

  /kiosks:
    get:
      operationId: listKiosks
      summary: List registered kiosks.
      tags: [kiosks]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createKiosk
      summary: Register a new kiosk. The bearer token is returned exactly once.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKioskRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskWithToken"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/rotate-token:
    post:
      operationId: rotateKioskToken
      summary: Mint a fresh bearer token for a kiosk, invalidating the previous one.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskWithToken"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/disable:
    post:
      operationId: disableKiosk
      summary: Disable a kiosk, immediately rejecting any future requests from it.
      tags: [kiosks]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiosk"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/pairing-code:
    post:
      operationId: createKioskPairingCode
      summary: Generate a short-lived single-use pairing code for an iPad kiosk.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPairingCode"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/pair:
    post:
      operationId: pairKiosk
      summary: Redeem a pairing code for a working kiosk bearer token. Unauthenticated, rate-limited to 5 attempts/min per IP.
      tags: [kiosks]
      security: []
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairKioskRequest"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairKioskResponse"
        "404":
          description: Pairing code is invalid, expired, or already consumed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # RFC 9457 application/problem+json, the error shape for the whole API.
    # Registered types (docs/06-api-contract.md):
    # - invalid-token-format (400)
    # - credential-revoked (409)
    # - credential-unknown (404)
    # - credential-unbound (409)
    # - credential-already-bound (409)
    # - credential-not-active (409)
    # - credential-not-reprintable (409)
    # - credential-token-taken (409)
    # - device-on-loan (409)
    # - overlapping-custody (409)
    # - backdated-not-permitted (422)
    # - device-unavailable (409)
    # - user-suspended (403)
    # - session-expired (410)
    # - session-conflict (409)
    # - idempotency-mismatch (422)
    # - validation-failed (422)
    # - unauthorized (401)
    # - forbidden (403)
    # - rate-limited (429)
    # - pairing-code-invalid (404)
    # - loan-not-found (404)
    # - loan-not-open (409)
    # - kiosk-not-found (404)
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        extensions:
          type: object
          additionalProperties: true

    # --- Admin auth ---------------------------------------------------------

    AdminRole:
      type: string
      enum: [superadmin, admin, operator]

    Admin:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/AdminRole"

    LoginRequest:
      type: object
      required: [email, password, totpCode]
      properties:
        email: { type: string }
        password: { type: string }
        totpCode: { type: string }

    # --- Catalog --------------------------------------------------------------

    DeviceStatus:
      type: string
      enum: [available, on_loan, maintenance, retired, lost]

    DeviceCondition:
      type: string
      enum: [good, fair, damaged]

    Device:
      type: object
      required: [id, assetTag, name, categoryId, status, condition, createdAt, updatedAt]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        status:
          $ref: "#/components/schemas/DeviceStatus"
        condition:
          $ref: "#/components/schemas/DeviceCondition"
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor: { type: string }

    CreateDeviceRequest:
      type: object
      required: [assetTag, name, categoryId]
      properties:
        assetTag: { type: string }
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }

    UpdateDeviceRequest:
      type: object
      required: [name, categoryId]
      properties:
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }
        condition:
          $ref: "#/components/schemas/DeviceCondition"

    SetDeviceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DeviceStatus"
        reason: { type: string }

    Category:
      type: object
      required: [id, name, requiresApproval, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }
        createdAt: { type: string, format: date-time }

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }

    # --- Identity ---------------------------------------------------------

    UserStatus:
      type: string
      enum: [active, suspended, archived]

    User:
      type: object
      required: [id, employeeNo, fullName, status, registeredAt, registeredBy, updatedAt]
      properties:
        id: { type: string }
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        status:
          $ref: "#/components/schemas/UserStatus"
        notes: { type: string }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
        updatedAt: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor: { type: string }

    CreateUserRequest:
      type: object
      required: [employeeNo, fullName]
      properties:
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }

    UpdateUserRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }

    SuspendUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    RegisterWithCardRequest:
      type: object
      required: [employeeNo, fullName]
      properties:
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }
        credentialId:
          type: string
          description: >
            An existing unbound blank credential to bind. If omitted, a
            fresh QR credential is minted for the new user instead.

    RegisterWithCardResponse:
      type: object
      required: [user, credential]
      properties:
        user:
          $ref: "#/components/schemas/User"
        credential:
          $ref: "#/components/schemas/Credential"
        token:
          type: string
          description: >
            The plaintext token, present only when a fresh credential was
            minted (no credentialId was supplied). Absent when an existing
            blank card was bound instead — its token was already disclosed
            at the moment it was printed and is not recoverable now.

    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DepartmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Department"

    # --- Credentials --------------------------------------------------------

    CredentialKind:
      type: string
      enum: [qr, code128, nfc, rfid, manual]

    SubjectType:
      type: string
      enum: [user, device]

    CredentialStatus:
      type: string
      enum: [active, revoked, lost]

    Credential:
      type: object
      required: [id, subjectType, kind, status, issueSeq, issuedAt, issuedBy, printedCount]
      properties:
        id: { type: string }
        subjectType:
          $ref: "#/components/schemas/SubjectType"
        subjectId:
          type: string
          description: Absent when the credential is unbound blank stock.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        tokenPreview: { type: string }
        label: { type: string }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        issueSeq: { type: integer }
        replacesId: { type: string }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        revokedAt: { type: string, format: date-time }
        revokedBy: { type: string }
        revokedReason: { type: string }
        printedCount: { type: integer }
        lastPrintedAt: { type: string, format: date-time }

    IssuedCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext token. Returned exactly once, at the moment of issuance, reprint, or reissue — never retrievable again after this response.

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"

    IssueCredentialRequest:
      type: object
      required: [subjectType, kind]
      properties:
        subjectType:
          $ref: "#/components/schemas/SubjectType"
        subjectId:
          type: string
          description: Omit with subjectType "user" to mint unbound blank card stock.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        label: { type: string }
        manualToken:
          type: string
          description: Required, and used verbatim, only when kind is "manual".

    IssueBlankBatchRequest:
      type: object
      required: [count, kind]
      properties:
        count: { type: integer, minimum: 1 }
        kind:
          $ref: "#/components/schemas/CredentialKind"

    IssueBlankBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssuedCredential"

    BindCredentialRequest:
      type: object
      required: [subjectId]
      properties:
        subjectId: { type: string }

    RevokeCredentialRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    ReissueCredentialRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        manualToken: { type: string }

    CredentialEvent:
      type: object
      required: [at, kind, actor]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        actor: { type: string }
        reason: { type: string }

    CredentialEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialEvent"

    UnboundCountResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    ResolvedCredentialType:
      type: string
      description: >
        Resolve's subject discriminator. "unbound" is a successful
        resolution of a real, unbound blank card (INV-12) — not an error.
      enum: [user, device, unbound]

    ResolvedCredential:
      type: object
      required: [type, credentialId, credentialStatus, kind]
      properties:
        type:
          $ref: "#/components/schemas/ResolvedCredentialType"
        subjectId:
          type: string
          description: Absent when type is "unbound".
        credentialId: { type: string }
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
        kind:
          $ref: "#/components/schemas/CredentialKind"

    # --- Paper backfill (2.4b) ------------------------------------------------

    BackfillAction:
      type: string
      enum: [borrow, return]

    BackfillResolution:
      type: string
      description: >
        The admin's answer to a conflict the preview reported (FR-75). The
        application never picks one. "change-device" is client-side: by
        save-time the asset tag has been edited, so a row still carrying it
        is rejected as unresolved.
      enum: [truncate-existing, change-device, discard-row, record-as-disputed]

    BackfillRowStatus:
      type: string
      enum: [ok, conflict, unresolved, discarded]

    BackfillNewUser:
      type: object
      required: [fullName, employeeNo]
      properties:
        fullName: { type: string }
        employeeNo: { type: string }
        departmentId: { type: string }

    BackfillUserRef:
      type: object
      description: >
        Discriminated union — exactly one of userId, employeeNo, token or
        newUser. The token form is how a scanned card identifies the person
        on the admin desk's USB scanner.
      properties:
        userId: { type: string }
        employeeNo: { type: string }
        token: { type: string }
        newUser:
          $ref: "#/components/schemas/BackfillNewUser"

    BackfillRow:
      type: object
      required: [clientRowId, deviceRef, userRef, borrowedAt]
      properties:
        clientRowId:
          type: string
          description: The row's key in the response, so the UI updates rows in place without reordering the admin's work.
        deviceRef:
          type: string
          description: An asset tag or a scanned device credential token — one field, one trigger pull.
        userRef:
          $ref: "#/components/schemas/BackfillUserRef"
        borrowedAt:
          type: string
          format: date-time
          description: The OUT time, with an explicit offset — the admin is reading a wall clock off paper.
        returnedAt:
          type: string
          format: date-time
          description: The IN time; absent means the row describes an open loan, which puts the device on loan.
        action:
          $ref: "#/components/schemas/BackfillAction"
        resolution:
          $ref: "#/components/schemas/BackfillResolution"
        note: { type: string }

    BackfillBatch:
      type: object
      required: [paperRef, rows]
      properties:
        paperRef:
          type: string
          description: Register page / slip reference, stamped on every loan the batch writes (INV-14).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BackfillRow"

    BackfillDeviceRef:
      type: object
      required: [id, assetTag, name]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }

    BackfillPersonRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string }
        fullName: { type: string }
        department: { type: string }

    BackfillExistingLoan:
      type: object
      required: [id, userDisplay, borrowedAt, origin]
      properties:
        id: { type: string }
        userDisplay: { type: string }
        department: { type: string }
        borrowedAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        origin: { type: string }

    BackfillConflict:
      type: object
      required: [type, existingLoan, resolutions]
      properties:
        type:
          type: string
          enum: [overlapping-custody]
        existingLoan:
          $ref: "#/components/schemas/BackfillExistingLoan"
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/BackfillResolution"

    BackfillRowResult:
      type: object
      required: [clientRowId, status]
      properties:
        clientRowId: { type: string }
        action:
          $ref: "#/components/schemas/BackfillAction"
        status:
          $ref: "#/components/schemas/BackfillRowStatus"
        device:
          $ref: "#/components/schemas/BackfillDeviceRef"
        user:
          $ref: "#/components/schemas/BackfillPersonRef"
        createsUser:
          type: boolean
          description: True when this row's person did not exist before the batch; drives the "issue cards to the new people" step (FR-77).
        loanId:
          type: string
          description: The loan this row created (commit only).
        closesLoanId:
          type: string
          description: The loan this row closed (return rows).
        userId:
          type: string
          description: The inline-created (or reused) person's id (commit only).
        disputed:
          type: boolean
          description: The row was recorded as a disputed claim — visible forever, never a custody fact.
        warnings:
          type: array
          items: { type: string }
        field:
          type: string
          description: The offending field, for unresolved rows.
        reason:
          type: string
          description: Why the row is unresolved, in admin-readable words.
        conflict:
          $ref: "#/components/schemas/BackfillConflict"

    BackfillSummary:
      type: object
      required: [ok, conflicts, newUsers]
      properties:
        ok: { type: integer }
        conflicts: { type: integer }
        newUsers: { type: integer }

    BackfillResult:
      type: object
      required: [rows, summary, committed]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BackfillRowResult"
        summary:
          $ref: "#/components/schemas/BackfillSummary"
        committed:
          type: boolean
          description: False for a preview and for a rejected commit (nothing was written).

    BackfillLastEntry:
      type: object
      required: [recordedAt]
      properties:
        paperRef: { type: string }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }

    # --- Sessions & Checkout (Kiosk) ----------------------------------------

    SessionState:
      type: string
      enum: [idle, awaiting_user, awaiting_device, ready, completed, expired, cancelled]

    SessionUser:
      type: object
      required: [id, fullName, department, openLoanCount]
      properties:
        id: { type: string }
        fullName: { type: string }
        department: { type: string }
        openLoanCount: { type: integer }

    SessionDevice:
      type: object
      required: [id, assetTag, name]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }

    SessionOpenLoan:
      type: object
      required: [id, deviceId, assetTag, deviceName, borrowedAt]
      properties:
        id: { type: string }
        deviceId: { type: string }
        assetTag: { type: string }
        deviceName: { type: string }
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }

    Session:
      type: object
      required: [id, kioskId, state, startedAt, expiresAt]
      properties:
        id: { type: string }
        kioskId: { type: string }
        state:
          $ref: "#/components/schemas/SessionState"
        user:
          $ref: "#/components/schemas/SessionUser"
        pendingDevice:
          $ref: "#/components/schemas/SessionDevice"
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    OutcomeKind:
      type: string
      enum: [device_pending, user_identified, borrowed, returned, rejected, duplicate, user_switched]

    MessageTone:
      type: string
      enum: [success, info, warning, error]

    SessionMessage:
      type: object
      required: [title, detail, tone]
      properties:
        title: { type: string }
        detail: { type: string }
        tone:
          $ref: "#/components/schemas/MessageTone"

    Outcome:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/OutcomeKind"
        loanId: { type: string }
        device:
          $ref: "#/components/schemas/SessionDevice"
        dueAt: { type: string, format: date-time }
        newSessionId: { type: string }

    ScanResult:
      type: object
      required: [session, outcome, openLoans, message]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        outcome:
          $ref: "#/components/schemas/Outcome"
        openLoans:
          type: array
          items:
            $ref: "#/components/schemas/SessionOpenLoan"
        message:
          $ref: "#/components/schemas/SessionMessage"

    ScanSource:
      type: string
      enum: [scanner, camera, manual]

    ScanRequest:
      type: object
      required: [token, source]
      properties:
        token: { type: string }
        source:
          $ref: "#/components/schemas/ScanSource"
        scannedAt: { type: string, format: date-time }

    ReturnSessionLoanRequest:
      type: object
      required: [loanId]
      properties:
        loanId: { type: string }

    # --- Loans --------------------------------------------------------------

    LoanStatus:
      type: string
      enum: [open, returned, written_off]

    LoanOrigin:
      type: string
      enum: [kiosk, admin, paper, import]

    Loan:
      type: object
      required: [id, deviceId, userId, status, origin, borrowedAt, borrowActor, borrowSource, disputed]
      properties:
        id: { type: string }
        deviceId: { type: string }
        userId: { type: string }
        status:
          $ref: "#/components/schemas/LoanStatus"
        origin:
          $ref: "#/components/schemas/LoanOrigin"
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        borrowKioskId: { type: string }
        returnKioskId: { type: string }
        borrowActor: { type: string }
        returnActor: { type: string }
        borrowSource: { type: string }
        returnSource: { type: string }
        conditionOut: { type: string }
        conditionIn: { type: string }
        notes: { type: string }
        sessionId: { type: string }
        paperRef: { type: string }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }
        backfillNote: { type: string }
        disputed: { type: boolean }

    LoanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Loan"
        nextCursor: { type: string }

    ForceReturnLoanRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        conditionIn:
          $ref: "#/components/schemas/DeviceCondition"
        returnedAt: { type: string, format: date-time }

    WriteOffLoanRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # --- Dashboard ----------------------------------------------------------

    CategoryAvailability:
      type: object
      required: [categoryId, categoryName, availableCount, totalCount]
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        availableCount: { type: integer }
        totalCount: { type: integer }

    ScanRejectionSummary:
      type: object
      required: [resolvedType, distinctTokens, totalScans]
      properties:
        resolvedType: { type: string }
        distinctTokens: { type: integer }
        totalScans: { type: integer }

    Dashboard:
      type: object
      required: [onLoanCount, overdueCount, availableCount, maintenanceCount, availabilityByCategory, turnedAwayCounts]
      properties:
        onLoanCount: { type: integer }
        overdueCount: { type: integer }
        availableCount: { type: integer }
        maintenanceCount: { type: integer }
        availabilityByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAvailability"
        turnedAwayCounts:
          type: array
          items:
            $ref: "#/components/schemas/ScanRejectionSummary"
        lastPaperEntry:
          $ref: "#/components/schemas/BackfillLastEntry"

    # --- Kiosks -------------------------------------------------------------

    KioskStatus:
      type: string
      enum: [active, disabled]

    Kiosk:
      type: object
      required: [id, name, enabledSources, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        enabledSources:
          type: array
          items: { type: string }
        status:
          $ref: "#/components/schemas/KioskStatus"
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    KioskWithToken:
      allOf:
        - $ref: "#/components/schemas/Kiosk"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext bearer token. Returned exactly once, at creation or rotation.

    KioskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kiosk"

    CreateKioskRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        location: { type: string }

    KioskPairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }

    PairKioskRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    PairKioskResponse:
      type: object
      required: [kioskId, name, token]
      properties:
        kioskId: { type: string }
        name: { type: string }
        token: { type: string }

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string

    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer

    QueryFilter:
      name: q
      in: query
      required: false
      schema:
        type: string

    DeviceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/DeviceStatus"

    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UserStatus"

    CategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string

    DepartmentFilter:
      name: department
      in: query
      required: false
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: >
        Stores the response for 24 h and replays it verbatim on a retry with
        the same key (a different body gets `idempotency-mismatch`, 422). The
        kiosk derives its key as sha256(session_id | device_id | action |
        minute_bucket) — the minute bucket is what makes a deliberate
        re-borrow a minute later a new transaction rather than a replay. The
        admin console may send any stable per-action value or omit the header.

  responses:
    ProblemResponse:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    kioskToken:
      type: http
      scheme: bearer
      description: Long-lived opaque token issued when a kiosk is registered.
    adminSession:
      type: apiKey
      in: cookie
      name: hdms_session
    serviceToken:
      type: http
      scheme: bearer
      description: Used by imports, exports and scheduled jobs.
