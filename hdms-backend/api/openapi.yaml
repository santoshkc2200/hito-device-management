openapi: 3.1.0
info:
  title: HDMS API
  description: >
    Hito Device Management System. Source of truth for the HTTP contract —
    see docs/06-api-contract.md. Go server interfaces are generated with
    oapi-codegen; the TypeScript client is generated with openapi-ts.
    Neither is hand-edited.

    Contract Versioning Rule:
    After the contract-v1 tag, a breaking change requires /v2, not a silent
    field change — kiosks in the field may lag a deploy.

    v1.1.0 (Phase 4, admin console) is additive only: new paths, new schemas,
    new optional request parameters, and new response fields. Nothing was
    removed, renamed or narrowed, so a client generated against v1.0.0 keeps
    working — which is the point, because a kiosk in a ward may be a deploy
    behind. The two relaxations are LoginRequest.totpCode becoming optional
    (a recovery code may stand in for it) and AdminRole gaining the role names
    docs/08-admin-console.md specifies; the v1.0.0 names remain accepted and
    are removed at v2, not here.

    v1.2.0 (Phase 7, staff identity) adds the staff realm and is additive only.
  version: "1.2.0"
servers:
  - url: /v1

security:
  - adminSession: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe. No auth.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe, including the database. No auth.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process and its dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # --- Admin auth ---------------------------------------------------------

  /auth/login:
    post:
      operationId: login
      summary: Admin login with password + TOTP. Sets the session and CSRF cookies.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. `Set-Cookie` carries `hdms_session` (HttpOnly) and `hdms_csrf` (readable, echoed back as `X-CSRF-Token` on mutating requests).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          description: Invalid credentials, invalid TOTP code, or a disabled account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        default:
          description: Error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/me:
    get:
      operationId: getCurrentAdmin
      summary: The identity of the currently authenticated admin.
      tags: [auth]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/me/locale:
    patch:
      operationId: updateMyLocale
      summary: Set the signed-in administrator's console language.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocaleRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          description: Unsupported locale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # --- Catalog --------------------------------------------------------------

  /devices:
    get:
      operationId: listDevices
      summary: List devices.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceStatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/QueryFilter"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createDevice
      summary: Register a new device.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}:
    get:
      operationId: getDevice
      summary: Fetch one device.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateDevice
      summary: Edit a device's fields, including its condition.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}/status:
    post:
      operationId: setDeviceStatus
      summary: Drive the device status lifecycle. Requires a reason for every transition except registration.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeviceStatusRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /categories:
    get:
      operationId: listCategories
      summary: List device categories.
      tags: [categories]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createCategory
      summary: Create a device category.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /categories/{id}:
    patch:
      operationId: updateCategory
      summary: Edit a device category.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Identity ---------------------------------------------------------

  /users:
    get:
      operationId: listUsers
      summary: List users.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserStatusFilter"
        - $ref: "#/components/parameters/HasCredentialFilter"
        - $ref: "#/components/parameters/DepartmentFilter"
        - $ref: "#/components/parameters/QueryFilter"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createUser
      summary: Register a borrower. Admin-only (FR-45); `registeredBy` is derived from the session, never client-supplied.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/register-with-card:
    post:
      operationId: registerUserWithCard
      summary: Register a borrower and bind a card in one atomic transaction (FR-41, FR-44, FR-59).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWithCardRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterWithCardResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}:
    get:
      operationId: getUser
      summary: Fetch one user.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateUser
      summary: Edit a user's fields. Employee number is not editable — it is the bulk-import matching key.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}/suspend:
    post:
      operationId: suspendUser
      summary: Suspend a borrower, recording why.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /departments:
    get:
      operationId: listDepartments
      summary: List departments, for the department picker on user forms.
      tags: [users]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createDepartment
      summary: Create a department. Admin-only.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      summary: Rename a department. Admin-only.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      operationId: deleteDepartment
      summary: Delete an unused department. Admin-only.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Credentials --------------------------------------------------------

  /credentials:
    get:
      operationId: listCredentialsBySubject
      summary: List every credential ever issued to one subject, most recent first.
      tags: [credentials]
      parameters:
        - name: subjectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SubjectType"
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CredentialStatus"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: issueCredential
      summary: Mint a new credential. The plaintext token is returned exactly once.
      tags: [credentials]
      x-sensitive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/blank-batch:
    post:
      operationId: issueBlankBatch
      summary: Mint a batch of unbound "blank card stock" credentials.
      tags: [credentials]
      x-sensitive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueBlankBatchRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueBlankBatchResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/unbound-count:
    get:
      operationId: getUnboundCredentialCount
      summary: Count of unbound "blank card stock" credentials remaining.
      tags: [credentials]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnboundCountResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/resolve:
    get:
      operationId: resolveCredential
      summary: Resolve a scanned token to its credential and subject, for binding a physical card during registration.
      tags: [credentials]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/bind:
    post:
      operationId: bindCredential
      summary: Bind an unbound blank card to a subject.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindCredentialRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/reprint:
    post:
      operationId: reprintCredential
      summary: Recover and re-return the plaintext token of a device credential. Device tokens only.
      tags: [credentials]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      summary: Kill a token permanently, with no replacement minted.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCredentialRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/reissue:
    post:
      operationId: reissueCredential
      summary: For a lost card — revoke the old one and mint a new one in the same transaction.
      tags: [credentials]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReissueCredentialRequest"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /credentials/{id}/history:
    get:
      operationId: getCredentialHistory
      summary: One credential's issuance history.
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialEventList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Paper backfill (2.4b) -------------------------------------------------

  /backfill/preview:
    post:
      operationId: previewBackfillBatch
      summary: >
        Validate a staged paper-register batch and return, per row, the
        auto-detected action (FR-74), the resolved device and person, and any
        custody conflict — writing nothing. The screen calls it as rows change
        so a conflict surfaces while the admin is still looking at the page.
        Admin-only; the kiosk token cannot reach it.
      tags: [backfill]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillBatch"
      responses:
        "200":
          description: The per-row resolution. Conflicts and unresolved rows are ordinary row statuses here, not HTTP errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /backfill:
    post:
      operationId: recordBackfillBatch
      summary: >
        Commit a validated batch atomically — all rows or none. The same
        server-side validation the preview runs is re-run here; a preview is a
        convenience, never a grant. Returns the created loan ids and the ids of
        any users created, which the "issue cards to the new people" step
        (FR-77) is driven from. Admin-only; the kiosk token cannot reach it.
      tags: [backfill]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillBatch"
      responses:
        "200":
          description: The batch was committed. Per-row results carry the created loan ids and the created user ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillResult"
        "409":
          description: The batch contains a row that still conflicts with existing custody; nothing was written. `extensions.clientRowIds` names the conflicting rows — the structured per-row detail is what the preview is for.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /backfill/last-entry:
    get:
      operationId: getBackfillLastEntry
      summary: When a paper page was last recorded — the dashboard's backlog nag (Q11).
      tags: [backfill]
      responses:
        "200":
          description: The most recent paper-origin recording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillLastEntry"
        "204":
          description: No paper entry has been recorded yet.
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Sessions (Kiosk) ---------------------------------------------------

  /sessions:
    post:
      operationId: createSession
      summary: Create a scan session.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      summary: Current state of a scan session (recovery after reload).
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      operationId: cancelSession
      summary: Cancel a scan session.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Session cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/scan:
    post:
      operationId: submitScan
      summary: Submit a scanned token.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Complete session state and outcome. Rejections are 200 with outcome.kind = "rejected".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/return-loan:
    post:
      operationId: returnSessionLoan
      summary: Return an open loan by selecting it directly rather than scanning.
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnSessionLoanRequest"
      responses:
        "200":
          description: Complete session state and outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /sessions/{id}/close:
    post:
      operationId: closeSession
      summary: Finish a scan session ("Done").
      tags: [sessions]
      security:
        - kioskToken: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Session closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Loans --------------------------------------------------------------

  /loans:
    get:
      operationId: listLoans
      summary: List loans with optional filters and cursor pagination.
      tags: [loans]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanOrigin"
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: disputed
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}:
    get:
      operationId: getLoan
      summary: Fetch one loan by id.
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}/force-return:
    post:
      operationId: forceReturnLoan
      summary: Administratively close an open loan. Requires a reason.
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceReturnLoanRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /loans/{id}/write-off:
    post:
      operationId: writeOffLoan
      summary: Close an open loan as written-off (declared lost or destroyed).
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffLoanRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /devices/{id}/loans:
    get:
      operationId: listDeviceLoans
      summary: List loan history for one device.
      tags: [devices, loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}/loans:
    get:
      operationId: listUserLoans
      summary: List loan history for one user.
      tags: [users, loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Dashboard & Events -------------------------------------------------

  /dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard summary counts, overdue loans, availability by category, scan rejections, and paper backfill nag.
      tags: [dashboard]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /events/stream:
    get:
      operationId: getEventsStream
      summary: Server-Sent Events stream of domain events for live dashboard and admin updates.
      tags: [events]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Outbox event ID to replay missed events from.
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Kiosks -------------------------------------------------------------

  /kiosks:
    get:
      operationId: listKiosks
      summary: List registered kiosks.
      tags: [kiosks]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createKiosk
      summary: Register a new kiosk. The bearer token is returned exactly once.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKioskRequest"
      responses:
        "201":
          description: Created. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskWithToken"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/rotate-token:
    post:
      operationId: rotateKioskToken
      summary: Mint a fresh bearer token for a kiosk, invalidating the previous one.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskWithToken"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/disable:
    post:
      operationId: disableKiosk
      summary: Disable a kiosk, immediately rejecting any future requests from it.
      tags: [kiosks]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiosk"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/pairing-code:
    post:
      operationId: createKioskPairingCode
      summary: Generate a short-lived single-use pairing code for an iPad kiosk.
      tags: [kiosks]
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPairingCode"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/pair:
    post:
      operationId: pairKiosk
      summary: Redeem a pairing code for a working kiosk bearer token. Unauthenticated, rate-limited to 5 attempts/min per IP.
      tags: [kiosks]
      security: []
      x-sensitive: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairKioskRequest"
      responses:
        "200":
          description: OK. Never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairKioskResponse"
        "404":
          description: Pairing code is invalid, expired, or already consumed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"


  # --- Admin auth: self-service (4.1b) --------------------------------------

  /auth/password:
    post:
      operationId: changeOwnPassword
      summary: Change the authenticated admin's own password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed. Other sessions for this admin are revoked.
        default:
          $ref: "#/components/responses/ProblemResponse"

  /auth/totp/reenrol:
    post:
      operationId: beginTotpReenrolment
      summary: >
        Start TOTP re-enrolment for the authenticated admin. Returns the new
        secret exactly once; the existing secret stays valid until
        /auth/totp/confirm succeeds, so a half-finished enrolment cannot lock
        the admin out.
      tags: [auth]
      responses:
        "200":
          description: New secret, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrolment"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /auth/totp/confirm:
    post:
      operationId: confirmTotpReenrolment
      summary: Confirm a pending TOTP re-enrolment with a code from the new secret.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
      responses:
        "204":
          description: Confirmed. The previous secret is now dead.
        default:
          $ref: "#/components/responses/ProblemResponse"

  /auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: >
        Replace the authenticated admin's recovery codes. Returned in
        plaintext exactly once; stored hashed and redeemable once each.
      tags: [auth]
      responses:
        "200":
          description: New codes, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Admin accounts (4.1b) ------------------------------------------------

  /admins:
    get:
      operationId: listAdmins
      summary: List admin accounts.
      tags: [admins]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminList"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      operationId: createAdmin
      summary: >
        Create an admin account. Returns the TOTP enrolment payload and
        recovery codes exactly once — there is no way to read them again.
      tags: [admins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnrolment"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /admins/{id}:
    get:
      operationId: getAdmin
      summary: Fetch one admin account.
      tags: [admins]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateAdmin
      summary: Edit an admin's name, role or status. Email is not editable.
      tags: [admins]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /admins/{id}/reset-password:
    post:
      operationId: resetAdminPassword
      summary: Set a new password for another admin and revoke their sessions.
      tags: [admins]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAdminPasswordRequest"
      responses:
        "204":
          description: Reset.
        default:
          $ref: "#/components/responses/ProblemResponse"

  /admins/{id}/reset-totp:
    post:
      operationId: forceAdminTotpReenrolment
      summary: >
        Force another admin to re-enrol TOTP — the lost-phone path. Returns
        the new secret once, for handing over in person.
      tags: [admins]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: New secret, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrolment"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /admins/{id}/unlock:
    post:
      operationId: unlockAdmin
      summary: Clear a lockout imposed by repeated failed logins.
      tags: [admins]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "204":
          description: Unlocked.
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Registration support (4.4) -------------------------------------------

  /users/check-employee-no:
    get:
      operationId: checkEmployeeNo
      summary: >
        Live duplicate check for the registration form, called as the employee
        number is typed (FR-41). Cheap by design — it returns availability, not
        the matching user's record.
      tags: [users]
      parameters:
        - name: employeeNo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNoAvailability"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /users/{id}/archive:
    post:
      operationId: archiveUser
      summary: Archive a borrower. Refused while they still hold a device.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Loan overrides (4.8c) ------------------------------------------------

  /loans/{id}/correct-attribution:
    post:
      operationId: correctLoanAttribution
      summary: >
        Reassign a loan to the borrower who actually holds the device — the
        backfill-typo and wrong-card path. Audited as an override; the original
        borrower is preserved in the audit payload, not overwritten silently.
      tags: [loans]
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectAttributionRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Reports (4.9) --------------------------------------------------------

  /reports/summary:
    get:
      operationId: getReportSummary
      summary: Utilisation, average loan duration, top borrowers, overdue rate.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/by-origin:
    get:
      operationId: getTransactionsByOrigin
      summary: >
        Transactions by origin over time (FR-78) — the headline measure of
        whether paper is actually receding.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/BucketParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginReport"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/operational-health:
    get:
      operationId: getOperationalHealth
      summary: >
        Manual-entry count, camera-fallback count and rejection reasons. A
        rising trend means labels or scanners need attention before they
        become an outage.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalHealth"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/disputed:
    get:
      operationId: listDisputedLoans
      summary: Records forced past a custody conflict, permanently badged.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/loans.csv:
    get:
      operationId: exportLoansCsv
      summary: >
        Streaming CSV export of the loans list. Takes the same filters as
        GET /loans so the export matches what is on screen, and is streamed
        rather than buffered so a multi-year export does not hold memory.
      tags: [reports]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanOrigin"
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - name: disputed
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: CSV stream.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/devices.csv:
    get:
      operationId: exportDevicesCsv
      summary: Streaming CSV export of the devices list, same filters as GET /devices.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/DeviceStatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/QueryFilter"
      responses:
        "200":
          description: CSV stream.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  /reports/users.csv:
    get:
      operationId: exportUsersCsv
      summary: Streaming CSV export of the users list, same filters as GET /users.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/UserStatusFilter"
        - $ref: "#/components/parameters/DepartmentFilter"
        - $ref: "#/components/parameters/QueryFilter"
        - $ref: "#/components/parameters/HasCredentialFilter"
      responses:
        "200":
          description: CSV stream.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Audit log (4.9d) -----------------------------------------------------

  /audit:
    get:
      operationId: listAuditEvents
      summary: >
        The append-only audit trail, filterable by actor, action, subject and
        date. This is the screen that replaces "let me look through the
        register".
      tags: [audit]
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /audit.csv:
    get:
      operationId: exportAuditCsv
      summary: Streaming CSV export of the audit log, same filters as GET /audit.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: CSV stream.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- CSV import (4.3c, 4.4d) ----------------------------------------------

  /imports/users/preview:
    post:
      operationId: previewUserImport
      summary: >
        Validate a users CSV and return the per-row outcome without writing
        anything. The returned previewId is what POST /imports/users commits,
        so "preview and confirm" cannot drift into "confirm something else".
      tags: [imports]
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /imports/users:
    post:
      operationId: commitUserImport
      summary: Commit a previewed users import.
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitImportRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /imports/devices/preview:
    post:
      operationId: previewDeviceImport
      summary: Validate a devices CSV and return the per-row outcome without writing.
      tags: [imports]
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /imports/devices:
    post:
      operationId: commitDeviceImport
      summary: Commit a previewed devices import.
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitImportRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Settings (4.10) ------------------------------------------------------

  /settings:
    get:
      operationId: getSettings
      summary: Policy, label template and paper slip template.
      tags: [settings]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateSettings
      summary: >
        Update one or more settings sections. Each section present in the body
        replaces that section wholesale — there is no per-field merge, so a
        partial write cannot leave a template half-configured.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/ProblemResponse"

  # --- Kiosk management (4.10b) ---------------------------------------------

  /kiosks/{id}:
    get:
      operationId: getKiosk
      summary: Fetch one kiosk.
      tags: [kiosks]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiosk"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      operationId: updateKiosk
      summary: Edit a kiosk's name, location or enabled scan sources.
      tags: [kiosks]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKioskRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiosk"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /kiosks/{id}/enable:
    post:
      operationId: enableKiosk
      summary: Re-enable a disabled kiosk. Its token is unchanged.
      tags: [kiosks]
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiosk"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /staff/auth/password:
    post:
      operationId: staffPasswordLogin
      summary: Staff login with employee number and password. Sets the staff session cookies.
      tags: [staff]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPasswordLoginRequest"
      responses:
        "200":
          description: Authenticated. `Set-Cookie` carries `hdms_staff_session` and `hdms_staff_csrf`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        default:
          description: Invalid credentials, a locked account, or a suspended user.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /staff/auth/microsoft/start:
    get:
      operationId: staffMicrosoftStart
      summary: Begin Microsoft sign-in. Redirects to Entra.
      tags: [staff]
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
        default:
          description: Microsoft sign-in is not configured for this deployment.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /staff/auth/microsoft/callback:
    get:
      operationId: staffMicrosoftCallback
      summary: Entra redirect target. Links or provisions the user and sets the staff session cookies.
      tags: [staff]
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302":
          description: Redirect back into the staff app, signed in or with an error code.
        default:
          description: The state was unknown, or the tenant or domain is not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /staff/auth/logout:
    post:
      operationId: staffLogout
      summary: End the staff session.
      tags: [staff]
      responses:
        "204": {description: Logged out.}
        default:
          description: Error.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /staff/me:
    get:
      operationId: getStaffMe
      summary: The signed-in staff member, their status, and what the app must ask them for next.
      tags: [staff]
      responses:
        "200":
          description: The current staff member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StaffMe"}
        default:
          description: Error.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /staff/me/profile:
    post:
      operationId: completeStaffProfile
      summary: One-time completion of a self-signed-up profile. Sets the employee number and mints the QR.
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteStaffProfileRequest"}
      responses:
        "200":
          description: Profile completed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StaffMe"}
        default:
          description: The employee number is taken or invalid.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /staff/me/password:
    post:
      operationId: changeStaffPassword
      summary: Change the signed-in staff member's own password.
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeStaffPasswordRequest"}
      responses:
        "204": {description: Changed.}
        default:
          description: The current password was wrong, or the new one is too short.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # RFC 9457 application/problem+json, the error shape for the whole API.
    # Registered types (docs/06-api-contract.md):
    # - invalid-token-format (400)
    # - credential-revoked (409)
    # - credential-unknown (404)
    # - credential-unbound (409)
    # - credential-already-bound (409)
    # - credential-not-active (409)
    # - credential-not-reprintable (409)
    # - credential-token-taken (409)
    # - device-on-loan (409)
    # - overlapping-custody (409)
    # - backdated-not-permitted (422)
    # - device-unavailable (409)
    # - user-suspended (403)
    # - session-expired (410)
    # - session-conflict (409)
    # - idempotency-mismatch (422)
    # - validation-failed (422)
    # - unauthorized (401)
    # - forbidden (403)
    # - rate-limited (429)
    # - pairing-code-invalid (404)
    # - loan-not-found (404)
    # - loan-not-open (409)
    # - kiosk-not-found (404)
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        extensions:
          type: object
          additionalProperties: true

    # --- Admin auth ---------------------------------------------------------

    AdminRole:
      type: string
      description: >
        `admin` — everything. `technician` — devices, their status and
        condition, credential reprints, force-return; never staff, kiosks or
        other admins. `viewer` — read-only dashboard, loans and reports, for
        managers who want visibility without risk (docs/08-admin-console.md).
        `superadmin` and `operator` are the v1.0.0 names, accepted until v2 so
        an older client still parses; the server stops emitting them once the
        4.1a migration lands.
      enum: [admin, technician, viewer, superadmin, operator]

    Admin:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/AdminRole"
        locale:
          type: string
          enum: [ja, en]
          description: The administrator's console language preference.
        status:
          $ref: "#/components/schemas/AdminStatus"
        lastLoginAt: { type: string, format: date-time }
        lockedUntil:
          type: string
          format: date-time
          description: Set while a lockout from repeated failed logins is in force.
        mustChangePassword:
          type: boolean
        mustReenrolTotp:
          type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        totpCode:
          type: string
          description: Required unless recoveryCode is supplied instead.
        recoveryCode:
          type: string
          description: >
            One of the admin's recovery codes, standing in for the TOTP code
            when the authenticator is unavailable. Single use.

    UpdateLocaleRequest:
      type: object
      required: [locale]
      properties:
        locale:
          type: string
          enum: [ja, en]

    # --- Catalog --------------------------------------------------------------

    DeviceStatus:
      type: string
      enum: [available, on_loan, maintenance, retired, lost]

    DeviceCondition:
      type: string
      enum: [good, fair, damaged]

    Device:
      type: object
      required: [id, assetTag, name, categoryId, status, condition, createdAt, updatedAt]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        status:
          $ref: "#/components/schemas/DeviceStatus"
        condition:
          $ref: "#/components/schemas/DeviceCondition"
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor: { type: string }

    CreateDeviceRequest:
      type: object
      required: [assetTag, name, categoryId]
      properties:
        assetTag: { type: string }
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }

    UpdateDeviceRequest:
      type: object
      required: [name, categoryId]
      properties:
        name: { type: string }
        categoryId: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNo: { type: string }
        homeLocation: { type: string }
        notes: { type: string }
        acquiredOn: { type: string, format: date }
        condition:
          $ref: "#/components/schemas/DeviceCondition"

    SetDeviceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DeviceStatus"
        reason: { type: string }

    Category:
      type: object
      required: [id, name, requiresApproval, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }
        createdAt: { type: string, format: date-time }

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        defaultLoanPeriodSeconds: { type: integer, format: int64 }
        requiresApproval: { type: boolean }

    # --- Identity ---------------------------------------------------------

    UserStatus:
      type: string
      enum: [active, suspended, archived]

    User:
      type: object
      required: [id, employeeNo, fullName, status, registeredAt, registeredBy, updatedAt]
      properties:
        id: { type: string }
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        status:
          $ref: "#/components/schemas/UserStatus"
        notes: { type: string }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
        updatedAt: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor: { type: string }

    CreateUserRequest:
      type: object
      required: [employeeNo, fullName]
      properties:
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }

    UpdateUserRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }

    SuspendUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    RegisterWithCardRequest:
      type: object
      required: [employeeNo, fullName]
      properties:
        employeeNo: { type: string }
        fullName: { type: string }
        departmentId: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }
        credentialId:
          type: string
          description: >
            An existing unbound blank credential to bind. If omitted, a
            fresh QR credential is minted for the new user instead.

    RegisterWithCardResponse:
      type: object
      required: [user, credential]
      properties:
        user:
          $ref: "#/components/schemas/User"
        credential:
          $ref: "#/components/schemas/Credential"
        token:
          type: string
          description: >
            The plaintext token, present only when a fresh credential was
            minted (no credentialId was supplied). Absent when an existing
            blank card was bound instead — its token was already disclosed
            at the moment it was printed and is not recoverable now.

    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DepartmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Department"

    CreateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    UpdateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    # --- Credentials --------------------------------------------------------

    CredentialKind:
      type: string
      enum: [qr, code128, nfc, rfid, manual]

    SubjectType:
      type: string
      enum: [user, device]

    CredentialStatus:
      type: string
      enum: [active, revoked, lost]

    Credential:
      type: object
      required: [id, subjectType, kind, status, issueSeq, issuedAt, issuedBy, printedCount]
      properties:
        id: { type: string }
        subjectType:
          $ref: "#/components/schemas/SubjectType"
        subjectId:
          type: string
          description: Absent when the credential is unbound blank stock.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        tokenPreview: { type: string }
        label: { type: string }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        issueSeq: { type: integer }
        replacesId: { type: string }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        revokedAt: { type: string, format: date-time }
        revokedBy: { type: string }
        revokedReason: { type: string }
        printedCount: { type: integer }
        lastPrintedAt: { type: string, format: date-time }

    IssuedCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext token. Returned exactly once, at the moment of issuance, reprint, or reissue — never retrievable again after this response.

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"

    IssueCredentialRequest:
      type: object
      required: [subjectType, kind]
      properties:
        subjectType:
          $ref: "#/components/schemas/SubjectType"
        subjectId:
          type: string
          description: Omit with subjectType "user" to mint unbound blank card stock.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        label: { type: string }
        manualToken:
          type: string
          description: Required, and used verbatim, only when kind is "manual".

    IssueBlankBatchRequest:
      type: object
      required: [count, kind]
      properties:
        count: { type: integer, minimum: 1 }
        kind:
          $ref: "#/components/schemas/CredentialKind"

    IssueBlankBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssuedCredential"

    BindCredentialRequest:
      type: object
      required: [subjectId]
      properties:
        subjectId: { type: string }

    RevokeCredentialRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    ReissueCredentialRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        manualToken: { type: string }

    CredentialEvent:
      type: object
      required: [at, kind, actor]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        actor: { type: string }
        reason: { type: string }

    CredentialEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialEvent"

    UnboundCountResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    ResolvedCredentialType:
      type: string
      description: >
        Resolve's subject discriminator. "unbound" is a successful
        resolution of a real, unbound blank card (INV-12) — not an error.
      enum: [user, device, unbound]

    ResolvedCredential:
      type: object
      required: [type, credentialId, credentialStatus, kind]
      properties:
        type:
          $ref: "#/components/schemas/ResolvedCredentialType"
        subjectId:
          type: string
          description: Absent when type is "unbound".
        credentialId: { type: string }
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
        kind:
          $ref: "#/components/schemas/CredentialKind"

    # --- Paper backfill (2.4b) ------------------------------------------------

    BackfillAction:
      type: string
      enum: [borrow, return]

    BackfillResolution:
      type: string
      description: >
        The admin's answer to a conflict the preview reported (FR-75). The
        application never picks one. "change-device" is client-side: by
        save-time the asset tag has been edited, so a row still carrying it
        is rejected as unresolved.
      enum: [truncate-existing, change-device, discard-row, record-as-disputed]

    BackfillRowStatus:
      type: string
      enum: [ok, conflict, unresolved, discarded]

    BackfillNewUser:
      type: object
      required: [fullName, employeeNo]
      properties:
        fullName: { type: string }
        employeeNo: { type: string }
        departmentId: { type: string }

    BackfillUserRef:
      type: object
      description: >
        Discriminated union — exactly one of userId, employeeNo, token or
        newUser. The token form is how a scanned card identifies the person
        on the admin desk's USB scanner.
      properties:
        userId: { type: string }
        employeeNo: { type: string }
        token: { type: string }
        newUser:
          $ref: "#/components/schemas/BackfillNewUser"

    BackfillRow:
      type: object
      required: [clientRowId, deviceRef, userRef, borrowedAt]
      properties:
        clientRowId:
          type: string
          description: The row's key in the response, so the UI updates rows in place without reordering the admin's work.
        deviceRef:
          type: string
          description: An asset tag or a scanned device credential token — one field, one trigger pull.
        userRef:
          $ref: "#/components/schemas/BackfillUserRef"
        borrowedAt:
          type: string
          format: date-time
          description: The OUT time, with an explicit offset — the admin is reading a wall clock off paper.
        returnedAt:
          type: string
          format: date-time
          description: The IN time; absent means the row describes an open loan, which puts the device on loan.
        action:
          $ref: "#/components/schemas/BackfillAction"
        resolution:
          $ref: "#/components/schemas/BackfillResolution"
        note: { type: string }

    BackfillBatch:
      type: object
      required: [paperRef, rows]
      properties:
        paperRef:
          type: string
          description: Register page / slip reference, stamped on every loan the batch writes (INV-14).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BackfillRow"

    BackfillDeviceRef:
      type: object
      required: [id, assetTag, name]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }

    BackfillPersonRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string }
        fullName: { type: string }
        department: { type: string }

    BackfillExistingLoan:
      type: object
      required: [id, userDisplay, borrowedAt, origin]
      properties:
        id: { type: string }
        userDisplay: { type: string }
        department: { type: string }
        borrowedAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        origin: { type: string }

    BackfillConflict:
      type: object
      required: [type, existingLoan, resolutions]
      properties:
        type:
          type: string
          enum: [overlapping-custody]
        existingLoan:
          $ref: "#/components/schemas/BackfillExistingLoan"
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/BackfillResolution"

    BackfillRowResult:
      type: object
      required: [clientRowId, status]
      properties:
        clientRowId: { type: string }
        action:
          $ref: "#/components/schemas/BackfillAction"
        status:
          $ref: "#/components/schemas/BackfillRowStatus"
        device:
          $ref: "#/components/schemas/BackfillDeviceRef"
        user:
          $ref: "#/components/schemas/BackfillPersonRef"
        createsUser:
          type: boolean
          description: True when this row's person did not exist before the batch; drives the "issue cards to the new people" step (FR-77).
        loanId:
          type: string
          description: The loan this row created (commit only).
        closesLoanId:
          type: string
          description: The loan this row closed (return rows).
        userId:
          type: string
          description: The inline-created (or reused) person's id (commit only).
        disputed:
          type: boolean
          description: The row was recorded as a disputed claim — visible forever, never a custody fact.
        warnings:
          type: array
          items: { type: string }
        field:
          type: string
          description: The offending field, for unresolved rows.
        reason:
          type: string
          description: Why the row is unresolved, in admin-readable words.
        conflict:
          $ref: "#/components/schemas/BackfillConflict"

    BackfillSummary:
      type: object
      required: [ok, conflicts, newUsers]
      properties:
        ok: { type: integer }
        conflicts: { type: integer }
        newUsers: { type: integer }

    BackfillResult:
      type: object
      required: [rows, summary, committed]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BackfillRowResult"
        summary:
          $ref: "#/components/schemas/BackfillSummary"
        committed:
          type: boolean
          description: False for a preview and for a rejected commit (nothing was written).

    BackfillLastEntry:
      type: object
      required: [recordedAt]
      properties:
        paperRef: { type: string }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }

    # --- Sessions & Checkout (Kiosk) ----------------------------------------

    SessionState:
      type: string
      enum: [idle, awaiting_user, awaiting_device, ready, completed, expired, cancelled]

    SessionUser:
      type: object
      required: [id, fullName, department, openLoanCount]
      properties:
        id: { type: string }
        fullName: { type: string }
        department: { type: string }
        openLoanCount: { type: integer }

    SessionDevice:
      type: object
      required: [id, assetTag, name]
      properties:
        id: { type: string }
        assetTag: { type: string }
        name: { type: string }

    SessionOpenLoan:
      type: object
      required: [id, deviceId, assetTag, deviceName, borrowedAt]
      properties:
        id: { type: string }
        deviceId: { type: string }
        assetTag: { type: string }
        deviceName: { type: string }
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }

    Session:
      type: object
      required: [id, kioskId, state, startedAt, expiresAt]
      properties:
        id: { type: string }
        kioskId: { type: string }
        state:
          $ref: "#/components/schemas/SessionState"
        user:
          $ref: "#/components/schemas/SessionUser"
        pendingDevice:
          $ref: "#/components/schemas/SessionDevice"
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    OutcomeKind:
      type: string
      enum: [device_pending, user_identified, borrowed, returned, rejected, duplicate, user_switched]

    MessageTone:
      type: string
      enum: [success, info, warning, error]

    SessionMessage:
      type: object
      required: [title, detail, tone]
      properties:
        title: { type: string }
        detail: { type: string }
        tone:
          $ref: "#/components/schemas/MessageTone"

    Outcome:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/OutcomeKind"
        loanId: { type: string }
        device:
          $ref: "#/components/schemas/SessionDevice"
        dueAt: { type: string, format: date-time }
        newSessionId: { type: string }

    ScanResult:
      type: object
      required: [session, outcome, openLoans, message]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        outcome:
          $ref: "#/components/schemas/Outcome"
        openLoans:
          type: array
          items:
            $ref: "#/components/schemas/SessionOpenLoan"
        message:
          $ref: "#/components/schemas/SessionMessage"

    ScanSource:
      type: string
      enum: [scanner, camera, manual]

    ScanRequest:
      type: object
      required: [token, source]
      properties:
        token: { type: string }
        source:
          $ref: "#/components/schemas/ScanSource"
        scannedAt: { type: string, format: date-time }

    ReturnSessionLoanRequest:
      type: object
      required: [loanId]
      properties:
        loanId: { type: string }

    # --- Loans --------------------------------------------------------------

    LoanStatus:
      type: string
      enum: [open, returned, written_off]

    LoanOrigin:
      type: string
      enum: [kiosk, admin, paper, import]

    Loan:
      type: object
      required: [id, deviceId, userId, status, origin, borrowedAt, borrowActor, borrowSource, disputed]
      properties:
        id: { type: string }
        deviceId: { type: string }
        userId: { type: string }
        status:
          $ref: "#/components/schemas/LoanStatus"
        origin:
          $ref: "#/components/schemas/LoanOrigin"
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        borrowKioskId: { type: string }
        returnKioskId: { type: string }
        borrowActor: { type: string }
        returnActor: { type: string }
        borrowSource: { type: string }
        returnSource: { type: string }
        conditionOut: { type: string }
        conditionIn: { type: string }
        notes: { type: string }
        sessionId: { type: string }
        paperRef: { type: string }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }
        backfillNote: { type: string }
        disputed: { type: boolean }

    LoanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Loan"
        nextCursor: { type: string }

    ForceReturnLoanRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        conditionIn:
          $ref: "#/components/schemas/DeviceCondition"
        returnedAt: { type: string, format: date-time }

    WriteOffLoanRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # --- Dashboard ----------------------------------------------------------

    CategoryAvailability:
      type: object
      required: [categoryId, categoryName, availableCount, totalCount]
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        availableCount: { type: integer }
        totalCount: { type: integer }

    ScanRejectionSummary:
      type: object
      required: [resolvedType, distinctTokens, totalScans]
      properties:
        resolvedType: { type: string }
        distinctTokens: { type: integer }
        totalScans: { type: integer }

    Dashboard:
      type: object
      required: [onLoanCount, overdueCount, availableCount, maintenanceCount, availabilityByCategory, turnedAwayCounts]
      properties:
        onLoanCount: { type: integer }
        overdueCount: { type: integer }
        availableCount: { type: integer }
        maintenanceCount: { type: integer }
        availabilityByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAvailability"
        turnedAwayCounts:
          type: array
          items:
            $ref: "#/components/schemas/ScanRejectionSummary"
        lastPaperEntry:
          $ref: "#/components/schemas/BackfillLastEntry"
        overdueLoans:
          type: array
          items:
            $ref: "#/components/schemas/OverdueLoanSummary"
          description: Worst first, so the list needs no client-side sort to be actionable.
        unboundCredentialCount:
          type: integer
          description: Blank cards printed but not yet bound. Warn below policy.lowStockThreshold.
        kiosks:
          type: array
          items:
            $ref: "#/components/schemas/Kiosk"
          description: The kiosk status strip, with last-seen times.
        lowStockThreshold:
          type: integer
          description: Echoed from settings so the strip renders in one call.
        paperBacklogHours:
          type: integer
          description: Echoed from settings, for the paper backlog warning.

    # --- Kiosks -------------------------------------------------------------

    KioskStatus:
      type: string
      enum: [active, disabled]

    Kiosk:
      type: object
      required: [id, name, enabledSources, status, defaultLocale, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        defaultLocale:
          type: string
          enum: [ja, en]
          description: >
            The locale this kiosk starts every session in. A language toggle on
            the kiosk is per-session only; it resets to this value on idle.
        enabledSources:
          type: array
          items: { type: string }
        status:
          $ref: "#/components/schemas/KioskStatus"
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    KioskWithToken:
      allOf:
        - $ref: "#/components/schemas/Kiosk"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext bearer token. Returned exactly once, at creation or rotation.

    KioskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kiosk"

    CreateKioskRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        location: { type: string }

    KioskPairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          description: Six-digit, single-use code. Expires ten minutes after issuance.
        expiresAt: { type: string, format: date-time }

    PairKioskRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6

    PairKioskResponse:
      type: object
      required: [kioskId, name, token, defaultLocale]
      properties:
        kioskId: { type: string }
        name: { type: string }
        token: { type: string }
        defaultLocale:
          type: string
          enum: [ja, en]


    # --- Admin accounts (4.1b) ------------------------------------------------

    AdminStatus:
      type: string
      enum: [active, disabled, locked]

    AdminList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Admin"

    CreateAdminRequest:
      type: object
      required: [email, fullName, role, password]
      properties:
        email: { type: string }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/AdminRole"
        password: { type: string }

    UpdateAdminRequest:
      type: object
      properties:
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminStatus"

    ResetAdminPasswordRequest:
      type: object
      required: [password, reason]
      properties:
        password: { type: string }
        reason: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }

    TotpEnrolment:
      type: object
      required: [otpauthUrl, totpSecret]
      properties:
        otpauthUrl:
          type: string
          description: otpauth:// URI for the authenticator app's QR code. Returned once.
        totpSecret:
          type: string
          description: Base32 secret, for manual entry. Returned once.

    ConfirmTotpRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode: { type: string }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
          description: Plaintext, returned once, stored hashed, redeemable once each.

    AdminEnrolment:
      type: object
      required: [admin, enrolment, recoveryCodes]
      properties:
        admin:
          $ref: "#/components/schemas/Admin"
        enrolment:
          $ref: "#/components/schemas/TotpEnrolment"
        recoveryCodes:
          $ref: "#/components/schemas/RecoveryCodes"

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # --- Registration support (4.4) -------------------------------------------

    EmployeeNoAvailability:
      type: object
      required: [employeeNo, available]
      properties:
        employeeNo: { type: string }
        available: { type: boolean }
        existingUserId:
          type: string
          description: >
            Present only when the number is taken and the caller may view the
            holder — enough to offer "open that record", not a data leak.

    # --- Loan overrides (4.8c) ------------------------------------------------

    CorrectAttributionRequest:
      type: object
      required: [userId, reason]
      properties:
        userId:
          type: string
          description: The borrower who actually holds the device.
        reason: { type: string }

    # --- Reports (4.9) --------------------------------------------------------

    ReportBucket:
      type: string
      enum: [day, week, month]

    CategoryUtilisation:
      type: object
      required: [categoryId, categoryName, deviceCount, loanCount, utilisationPct]
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        deviceCount: { type: integer }
        loanCount: { type: integer }
        utilisationPct:
          type: number
          description: Share of the window during which devices in this category were on loan, 0–100.
        averageDurationHours: { type: number }

    TopBorrower:
      type: object
      required: [userId, fullName, employeeNo, loanCount]
      properties:
        userId: { type: string }
        fullName: { type: string }
        employeeNo: { type: string }
        loanCount: { type: integer }

    ReportSummary:
      type: object
      required: [from, to, totalLoans, openLoans, overdueCount, overdueRate, utilisationByCategory, topBorrowers]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalLoans: { type: integer }
        openLoans: { type: integer }
        overdueCount: { type: integer }
        overdueRate:
          type: number
          description: Overdue loans as a share of all loans in the window, 0–1.
        averageLoanDurationHours: { type: number }
        utilisationByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryUtilisation"
        topBorrowers:
          type: array
          items:
            $ref: "#/components/schemas/TopBorrower"

    OriginCount:
      type: object
      required: [origin, count]
      properties:
        origin:
          $ref: "#/components/schemas/LoanOrigin"
        count: { type: integer }

    OriginBucket:
      type: object
      required: [periodStart, total, counts]
      properties:
        periodStart: { type: string, format: date-time }
        total: { type: integer }
        counts:
          type: array
          items:
            $ref: "#/components/schemas/OriginCount"

    OriginReport:
      type: object
      required: [from, to, bucket, buckets]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket:
          $ref: "#/components/schemas/ReportBucket"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/OriginBucket"

    ScanSourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          $ref: "#/components/schemas/ScanSource"
        count: { type: integer }

    ScanRejectionReasonCount:
      type: object
      required: [count]
      properties:
        reason:
          type: string
          description: Absent when the rejection carried no reason code.
        resolvedType: { type: string }
        count: { type: integer }

    OperationalHealth:
      type: object
      required: [from, to, totalScans, manualEntryCount, cameraFallbackCount, scansBySource, rejectionReasons]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalScans: { type: integer }
        manualEntryCount: { type: integer }
        cameraFallbackCount: { type: integer }
        scansBySource:
          type: array
          items:
            $ref: "#/components/schemas/ScanSourceCount"
        rejectionReasons:
          type: array
          items:
            $ref: "#/components/schemas/ScanRejectionReasonCount"

    # --- Audit log (4.9d) -----------------------------------------------------

    AuditEvent:
      type: object
      required: [id, at, actor, action, subject, payload]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          type: string
          description: "'admin:<id>' | 'kiosk:<id>' | 'import' | 'system'."
        actorIp: { type: string }
        action:
          type: string
          description: "'user.created', 'credential.reissued', …"
        subject:
          type: string
          description: "'user:<uuid>', 'device:<uuid>', …"
        payload:
          type: object
          additionalProperties: true
        requestId: { type: string }

    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor: { type: string }

    # --- CSV import (4.3c, 4.4d) ----------------------------------------------

    ImportRowAction:
      type: string
      description: >
        What committing would do with this row. "invalid" rather than "error"
        because oapi-codegen disambiguates colliding enum member names package
        wide, and an "error" member here would rename MessageTone's constants
        for no benefit — the word is also more accurate: the row is unusable,
        nothing has failed.
      enum: [create, update, skip, invalid]

    ImportProblem:
      type: object
      required: [code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    ImportRowPreview:
      type: object
      required: [lineNo, action, values]
      properties:
        lineNo:
          type: integer
          description: 1-based line in the uploaded file, so a problem points at a line the admin can find.
        action:
          $ref: "#/components/schemas/ImportRowAction"
        values:
          type: object
          additionalProperties: { type: string }
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ImportProblem"

    ImportSummary:
      type: object
      required: [totalRows, createCount, updateCount, skipCount, invalidCount]
      properties:
        totalRows: { type: integer }
        createCount: { type: integer }
        updateCount: { type: integer }
        skipCount: { type: integer }
        invalidCount: { type: integer }

    ImportPreview:
      type: object
      required: [previewId, expiresAt, columns, rows, summary]
      properties:
        previewId:
          type: string
          description: >
            Identifies the validated batch the server is holding. Commit takes
            this, not the file again, so the rows confirmed are exactly the
            rows previewed.
        expiresAt: { type: string, format: date-time }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowPreview"
        summary:
          $ref: "#/components/schemas/ImportSummary"

    CommitImportRequest:
      type: object
      required: [previewId]
      properties:
        previewId: { type: string }

    ImportResult:
      type: object
      required: [importId, createdCount, updatedCount, skippedCount]
      properties:
        importId:
          type: string
          description: >
            Recorded as provenance on every row it created, so a user detail
            page can say which import produced the record.
        createdCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer }
        createdSubjectIds:
          type: array
          items: { type: string }
          description: >
            Ids of the rows created, in file order — what the follow-up
            "issue cards to the N new people" step (FR-77) works from.

    # --- Settings (4.10) ------------------------------------------------------

    PolicySettings:
      type: object
      required: [blockOnOverdue, sessionIdleTimeoutSeconds, kioskSoundEnabled, lowStockThreshold, paperBacklogHours]
      properties:
        blockOnOverdue: { type: boolean }
        sessionIdleTimeoutSeconds: { type: integer }
        kioskSoundEnabled: { type: boolean }
        lowStockThreshold:
          type: integer
          description: The dashboard warns when the unbound blank-card count falls below this.
        paperBacklogHours:
          type: integer
          description: Hours since the last recorded paper page before the dashboard warns. Default 48.

    LabelTemplateSettings:
      type: object
      required: [sheetWidthMm, sheetHeightMm, columns, rows, marginTopMm, marginLeftMm, gutterXMm, gutterYMm, labelWidthMm, labelHeightMm]
      properties:
        sheetWidthMm: { type: number }
        sheetHeightMm: { type: number }
        columns: { type: integer }
        rows: { type: integer }
        marginTopMm: { type: number }
        marginLeftMm: { type: number }
        gutterXMm: { type: number }
        gutterYMm: { type: number }
        labelWidthMm: { type: number }
        labelHeightMm: { type: number }

    SlipTemplateSettings:
      type: object
      required: [hospitalName, pageRefFormat, rowsPerPage, columns]
      properties:
        hospitalName: { type: string }
        pageRefFormat:
          type: string
          description: Format of the printed page reference the backfill screen types back in (FR-72).
        rowsPerPage: { type: integer }
        columns:
          type: array
          items: { type: string }

    Settings:
      type: object
      required: [policy, labelTemplate, slipTemplate, updatedAt]
      properties:
        policy:
          $ref: "#/components/schemas/PolicySettings"
        labelTemplate:
          $ref: "#/components/schemas/LabelTemplateSettings"
        slipTemplate:
          $ref: "#/components/schemas/SlipTemplateSettings"
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    UpdateSettingsRequest:
      type: object
      description: Each section present replaces that section wholesale.
      properties:
        policy:
          $ref: "#/components/schemas/PolicySettings"
        labelTemplate:
          $ref: "#/components/schemas/LabelTemplateSettings"
        slipTemplate:
          $ref: "#/components/schemas/SlipTemplateSettings"

    # --- Kiosk management (4.10b) ---------------------------------------------

    UpdateKioskRequest:
      type: object
      properties:
        name: { type: string }
        location: { type: string }
        defaultLocale:
          type: string
          enum: [ja, en]
        enabledSources:
          type: array
          items: { type: string }

    # --- Dashboard support (4.7) ----------------------------------------------

    OverdueLoanSummary:
      type: object
      required: [loanId, deviceId, assetTag, deviceName, userId, userFullName, dueAt, daysOverdue]
      properties:
        loanId: { type: string }
        deviceId: { type: string }
        assetTag: { type: string }
        deviceName: { type: string }
        userId: { type: string }
        userFullName: { type: string }
        userEmployeeNo: { type: string }
        dueAt: { type: string, format: date-time }
        daysOverdue: { type: integer }

    StaffPasswordLoginRequest:
      type: object
      required: [employeeNo, password]
      properties:
        employeeNo: {type: string, maxLength: 32}
        password: {type: string, maxLength: 256}

    ChangeStaffPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 256}
        newPassword: {type: string, minLength: 12, maxLength: 256}

    CompleteStaffProfileRequest:
      type: object
      required: [employeeNo]
      properties:
        employeeNo: {type: string, maxLength: 32}
        departmentId: {type: string, format: uuid}

    StaffMe:
      type: object
      required: [userId, employeeNo, fullName, status, profileComplete, mustChangePassword, hasPassword, signInMethods]
      properties:
        userId: {type: string, format: uuid}
        employeeNo: {type: string}
        fullName: {type: string}
        email: {type: string}
        departmentName: {type: string}
        status: {type: string, enum: [active, suspended, archived]}
        profileComplete: {type: boolean}
        mustChangePassword: {type: boolean}
        hasPassword: {type: boolean}
        signInMethods:
          type: array
          items: {type: string, enum: [password, microsoft]}

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string

    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer

    QueryFilter:
      name: q
      in: query
      required: false
      schema:
        type: string

    DeviceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/DeviceStatus"

    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UserStatus"

    CategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string

    DepartmentFilter:
      name: department
      in: query
      required: false
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: >
        Stores the response for 24 h and replays it verbatim on a retry with
        the same key (a different body gets `idempotency-mismatch`, 422). The
        kiosk derives its key as sha256(session_id | device_id | action |
        minute_bucket) — the minute bucket is what makes a deliberate
        re-borrow a minute later a new transaction rather than a replay. The
        admin console may send any stable per-action value or omit the header.


    HasCredentialFilter:
      name: hasCredential
      in: query
      required: false
      schema:
        type: boolean
      description: >
        Filter by whether the user has an active credential. `false` is the
        registration console's "registered but no card issued" list — each row
        is someone who cannot use the kiosk yet.

    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time

    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

    BucketParam:
      name: bucket
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ReportBucket"

  responses:
    ProblemResponse:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    kioskToken:
      type: http
      scheme: bearer
      description: Long-lived opaque token issued when a kiosk is registered.
    adminSession:
      type: apiKey
      in: cookie
      name: hdms_session
    serviceToken:
      type: http
      scheme: bearer
      description: Used by imports, exports and scheduled jobs.
